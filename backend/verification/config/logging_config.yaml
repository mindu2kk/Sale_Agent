# Structured Logging Configuration với Correlation IDs
# Enhanced observability configuration for Verification Agent workflow tracking

# ===== STRUCTURED LOGGING CONFIGURATION =====

logging:
  # Global logging settings
  version: 1
  disable_existing_loggers: false
  
  # Log formatters
  formatters:
    # JSON structured formatter for production
    structured_json:
      class: "backend.verification.utils.logging.StructuredFormatter"
      format: "json"
      include_correlation_id: true
      include_workflow_context: true
      include_performance_metrics: true
      
    # Human-readable formatter for development
    detailed_console:
      format: "[{asctime}] {levelname:8} | {name:20} | {correlation_id:12} | {workflow_id:15} | {message}"
      datefmt: "%Y-%m-%d %H:%M:%S"
      
    # Minimal formatter for testing
    minimal:
      format: "{levelname}: {message}"
      style: "{"
  
  # Log handlers
  handlers:
    # Console handler for real-time monitoring
    console:
      class: "logging.StreamHandler"
      level: "INFO"
      formatter: "detailed_console"
      stream: "ext://sys.stdout"
      
    # File handler for persistent logging
    file:
      class: "logging.handlers.RotatingFileHandler"
      level: "DEBUG"
      formatter: "structured_json"
      filename: "logs/verification_workflow.log"
      maxBytes: 10485760  # 10MB
      backupCount: 5
      encoding: "utf8"
      
    # Error file handler for error-only logs
    error_file:
      class: "logging.handlers.RotatingFileHandler"
      level: "ERROR"
      formatter: "structured_json"
      filename: "logs/verification_errors.log"
      maxBytes: 5242880  # 5MB
      backupCount: 3
      encoding: "utf8"
      
    # Performance metrics handler
    metrics_file:
      class: "logging.handlers.TimedRotatingFileHandler"
      level: "INFO"
      formatter: "structured_json"
      filename: "logs/verification_metrics.log"
      when: "H"  # Rotate hourly
      interval: 1
      backupCount: 24  # Keep 24 hours
      encoding: "utf8"
      
    # Workflow execution handler
    workflow_file:
      class: "logging.handlers.TimedRotatingFileHandler"
      level: "INFO"
      formatter: "structured_json"
      filename: "logs/workflow_execution.log"
      when: "D"  # Rotate daily
      interval: 1
      backupCount: 7  # Keep 7 days
      encoding: "utf8"
  
  # Logger configuration
  loggers:
    # Root verification logger
    verification:
      level: "INFO"
      handlers: ["console", "file", "error_file"]
      propagate: false
      
    # Workflow execution logger
    verification.workflow:
      level: "INFO"
      handlers: ["workflow_file", "console"]
      propagate: false
      
    # Performance metrics logger
    verification.metrics:
      level: "INFO"
      handlers: ["metrics_file"]
      propagate: false
      
    # Agent-specific loggers
    verification.agent.verification:
      level: "INFO"
      handlers: ["file", "console"]
      propagate: false
      
    verification.agent.research:
      level: "INFO"
      handlers: ["file", "console"]
      propagate: false
      
    # Node execution loggers
    verification.nodes:
      level: "INFO"
      handlers: ["workflow_file", "console"]
      propagate: false
      
    # Error handling logger
    verification.errors:
      level: "WARNING"
      handlers: ["error_file", "console"]
      propagate: false

# ===== CORRELATION ID CONFIGURATION =====

correlation_tracking:
  # Correlation ID generation
  id_generation:
    format: "wf_{timestamp}_{random}"  # wf_20240115103015_abc123
    timestamp_format: "%Y%m%d%H%M%S"
    random_length: 6
    use_uuid: false  # Use custom format instead of UUID
    
  # Correlation context propagation
  context_propagation:
    enabled: true
    inherit_from_parent: true
    store_in_thread_local: true
    
  # Correlation ID validation
  validation:
    max_length: 50
    allowed_characters: "a-zA-Z0-9_-"
    require_prefix: "wf_"

# ===== WORKFLOW OBSERVABILITY CONFIGURATION =====

workflow_observability:
  # Execution step tracking
  execution_tracking:
    enabled: true
    track_node_transitions: true
    track_state_changes: true
    track_edge_evaluations: true
    track_performance_metrics: true
    
  # Workflow status monitoring
  status_monitoring:
    enabled: true
    status_update_interval_seconds: 5
    track_workflow_progress: true
    
    # Status categories
    status_categories:
      - "queued"
      - "running"
      - "verification"
      - "correction"
      - "approved"
      - "escalated"
      - "failed"
      - "timeout"
  
  # Real-time monitoring
  real_time_monitoring:
    enabled: true
    websocket_enabled: false  # For future dashboard integration
    polling_interval_seconds: 2
    
  # Execution history
  execution_history:
    enabled: true
    retention_days: 30
    compress_old_logs: true
    export_format: "json"
    
    # History fields to track
    tracked_fields:
      - workflow_id
      - correlation_id
      - start_time
      - end_time
      - total_execution_time
      - nodes_executed
      - retry_count
      - final_status
      - issues_found
      - performance_metrics

# ===== PERFORMANCE METRICS CONFIGURATION =====

performance_metrics:
  # Metrics collection
  collection:
    enabled: true
    collection_interval_seconds: 10
    aggregate_metrics: true
    
  # Timing metrics
  timing_metrics:
    track_node_execution_time: true
    track_llm_call_time: true
    track_db_query_time: true
    track_cache_access_time: true
    
  # Resource metrics
  resource_metrics:
    track_memory_usage: true
    track_cpu_usage: true
    track_token_usage: true
    track_api_calls: true
    
  # Business metrics
  business_metrics:
    track_verification_success_rate: true
    track_issue_detection_rate: true
    track_escalation_rate: true
    track_retry_rate: true
    
  # Metrics export
  export:
    enabled: true
    export_interval_seconds: 60
    export_format: "prometheus"  # prometheus, json, csv
    export_endpoint: "/metrics"

# ===== ERROR MONITORING CONFIGURATION =====

error_monitoring:
  # Error classification
  classification:
    enabled: true
    classify_by_severity: true
    classify_by_component: true
    classify_by_error_type: true
    
  # Error severity levels
  severity_levels:
    critical:
      - "workflow_timeout"
      - "data_corruption"
      - "security_breach"
    high:
      - "verification_failure"
      - "api_timeout"
      - "database_error"
    medium:
      - "retry_exceeded"
      - "cache_miss"
      - "validation_error"
    low:
      - "warning_threshold"
      - "performance_degradation"
  
  # Error alerting
  alerting:
    enabled: true
    alert_channels: ["log", "webhook"]
    
    # Alert thresholds
    thresholds:
      error_rate_per_minute: 5
      critical_errors_per_hour: 1
      consecutive_failures: 3
      
  # Error context preservation
  context_preservation:
    enabled: true
    include_stack_trace: true
    include_workflow_state: true
    include_correlation_chain: true
    max_context_size_kb: 100

# ===== LOG EXPORT AND ANALYTICS =====

log_export:
  # Export configuration
  export_enabled: true
  export_formats: ["json", "csv"]
  export_schedule: "0 2 * * *"  # Daily at 2 AM
  
  # Export destinations
  destinations:
    local_file:
      enabled: true
      path: "exports/verification_logs"
      compression: "gzip"
      
    s3_bucket:
      enabled: false
      bucket_name: "verification-logs"
      prefix: "workflow-logs/"
      
    elasticsearch:
      enabled: false
      host: "localhost:9200"
      index_pattern: "verification-logs-{date}"
  
  # Data retention
  retention:
    raw_logs_days: 7
    aggregated_logs_days: 30
    exported_logs_days: 90
    
  # Analytics preparation
  analytics:
    enabled: true
    generate_daily_reports: true
    generate_performance_summaries: true
    track_trends: true

# ===== ENVIRONMENT-SPECIFIC OVERRIDES =====

environments:
  # Development environment
  development:
    logging:
      loggers:
        verification:
          level: "DEBUG"
        verification.workflow:
          level: "DEBUG"
    
    workflow_observability:
      execution_tracking:
        track_state_changes: true
        track_edge_evaluations: true
    
    performance_metrics:
      collection:
        collection_interval_seconds: 5
        
  # Production environment
  production:
    logging:
      loggers:
        verification:
          level: "WARNING"
        verification.workflow:
          level: "INFO"
      
      handlers:
        console:
          level: "WARNING"
    
    workflow_observability:
      execution_tracking:
        track_state_changes: false  # Reduce overhead
        
    performance_metrics:
      collection:
        collection_interval_seconds: 30
        
    error_monitoring:
      alerting:
        enabled: true
        alert_channels: ["webhook", "email"]
        
  # Testing environment
  testing:
    logging:
      loggers:
        verification:
          level: "ERROR"
          
      handlers:
        console:
          level: "ERROR"
        file:
          level: "ERROR"
    
    workflow_observability:
      execution_tracking:
        enabled: false
        
    performance_metrics:
      collection:
        enabled: false
        
    error_monitoring:
      alerting:
        enabled: false

# ===== INTEGRATION CONFIGURATION =====

integrations:
  # Distributed tracing
  distributed_tracing:
    enabled: false  # For future OpenTelemetry integration
    service_name: "verification-agent"
    trace_sampling_rate: 0.1
    
  # Monitoring systems
  monitoring_systems:
    prometheus:
      enabled: false
      metrics_port: 8080
      
    grafana:
      enabled: false
      dashboard_url: "http://localhost:3000"
      
    datadog:
      enabled: false
      api_key: "${DATADOG_API_KEY}"
      
  # Log aggregation
  log_aggregation:
    fluentd:
      enabled: false
      host: "localhost"
      port: 24224
      
    logstash:
      enabled: false
      host: "localhost"
      port: 5044

# ===== SECURITY AND COMPLIANCE =====

security:
  # Data sanitization
  data_sanitization:
    enabled: true
    sanitize_customer_data: true
    sanitize_api_keys: true
    sanitize_passwords: true
    
    # PII detection and masking
    pii_detection:
      enabled: true
      mask_email_addresses: true
      mask_phone_numbers: true
      mask_credit_cards: true
      
  # Log encryption
  log_encryption:
    enabled: false  # For future implementation
    encryption_algorithm: "AES-256"
    key_rotation_days: 90
    
  # Access control
  access_control:
    enabled: true
    require_authentication: false  # For future implementation
    role_based_access: false
    
  # Compliance
  compliance:
    gdpr_compliance: true
    data_retention_policy: true
    audit_trail: true
